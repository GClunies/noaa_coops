name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - run: uv run ruff check noaa_coops tests
      - run: uv run ruff format --check noaa_coops tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # mypy runs with python_version = 3.11 (the support floor), so the
          # env must hold the packages a 3.11 user resolves (e.g. numpy 2.4).
          python-version: '3.11'
      - run: uv sync --locked --all-extras --group dev
      - run: uv run mypy noaa_coops

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --group dev
      - run: uv run pytest -m "not live"
