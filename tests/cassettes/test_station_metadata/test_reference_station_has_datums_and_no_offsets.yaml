        \       ],\n        \"to_reach\": \"To reach the tidal bench marks from City
        Park in Fernandina Beach, proceed NW on Atlantic Avenue to the Fernandina
        Beach Marina.  The bench marks are in the area between Beach and Alachua Streets
        going north to south, and 10th Street to City Dock going east to west. To
        reach the Tide Station from the parking lot at 3 South Front Street, Fernandina
        Beach, FL. (Fernandina Beach Harbor Marina), proceed down the dock past the
        main building/restaurant (Brett's Waterway Cafe) to the Harbor masters building,
        past the building turn right and proceed past the building the new station
        is located under the fiberglass shark. The station is located in the corner
        of the dock to the commercial charter vessels.\\n\\nTo reach the remote Meteorological
        station from the tide station, proceed South on Front Street for 0.20 miles
        and the station will be on the left in a grass median between S front Street
        and multiple rail lines. The station is fenced in and consists of a Met Mast
        pole, hydrostand and an APX enclosure. The code to the lock is 1807.\",\n
